name: pixie
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # UI & Charts
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  flutter_joystick: ^0.2.2

  # Media & AI Input/Output
  flutter_voice_processor: ^1.1.2
  speech_to_text: ^7.0.0
  camera: ^0.12.0+1
  flutter_tts: ^4.0.0
  google_generative_ai: 0.4.7
  flutter_dotenv: ^6.0.1

  #firebase
  firebase_core: ^4.3.0
  cloud_firestore: ^6.1.1
  firebase_messaging: ^16.1.0

  # Utilities & Services
  intl: ^0.20.2
  url_launcher: ^6.2.0
  share_plus: ^13.1.0
  path_provider: ^2.1.5
  http: ^1.6.0
  syncfusion_flutter_xlsio: ^33.2.5
  open_file: ^3.3.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.2
  provider: ^6.1.5+1
  flutter_blue_plus: ^2.3.8

  # flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icon/icon.png

# ---- App icon generation config ----
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

  # Adaptive icon for Android
  adaptive_icon_background: "#1E1E1E"
  adaptive_icon_foreground: "assets/icon/icon.png"

  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#1E1E1E"
    theme_color: "#1E1E1E"

  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/icon/icon.png"